[package]
name = "soundclaude-server"
description = "HTTP backend exposing SoundCloud metadata and audio streaming"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "soundclaude-server"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
soundclaude.workspace = true

anyhow.workspace = true
axum = { version = "0.8", features = ["http2", "macros"] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal"] }
tower-http = { version = "0.6", features = ["cors", "trace", "limit", "timeout"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
